<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 0 552 420"><rect width="600" height="420" rx="16" fill="#f4f2ec"/><g font-family="Arial, sans-serif"><text x="24" y="42" font-size="28" fill="#234753">Una variable guarda un valor</text><rect x="24" y="75" width="552" height="80" rx="12" fill="#234753"/><text x="44" y="122" font-size="25" fill="#ffffff">porciones &lt;- personas * 3</text><rect x="24" y="185" width="258" height="145" rx="12" fill="#deeaec"/><text x="46" y="224" font-size="23" fill="#234753">personas</text><text x="46" y="295" font-size="54" fill="#234753">8</text><rect x="318" y="185" width="258" height="145" rx="12" fill="#deeaec"/><text x="340" y="224" font-size="23" fill="#234753">porciones</text><text x="340" y="295" font-size="54" fill="#234753">24</text><text x="24" y="380" font-size="23" fill="#234753">Si personas cambia, recalculamos.</text></g></svg>